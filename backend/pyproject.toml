[project]
name = "kikitoru"
version = "0.1.0"
description = "AI-powered meeting minutes from voice recordings, with Japanese language support."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.43.36",
    "fastapi[standard]>=0.100.0",
    "fractional-indexing>=0.1.3",
    "google-auth>=2.49",
    "greenlet>=3.5.0",
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langchain-google-genai>=4.2.2",
    "loguru>=0.7.3",
    "procrastinate>=3.9.0,<3.10",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "python-magic>=0.4",
    "ruff>=0.15.17",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3,transcribe]>=1.43.36",
    "keyrings-alt>=5.0.2",
    "pytest>=8.3",
    "ruff>=0.7",
]
db = [
    "alembic>=1.13",
    "sqlmodel>=0.0.22",
    "fractional-indexing>=0.1.3",
    "psycopg[binary,pool]>=3.3.4",
]

test = [
    "pytest>=8.3",
    "fastapi[standard]>=0.100.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.5",
    "langchain-core>=0.3",
    "langchain-google-genai>=4.2.2",
    "loguru>=0.7.3",
    "python-magic>=0.4",
    "slowapi>=0.1.10",
    "boto3>=1.43.36",
    "fractional-indexing>=0.1.3",
    "procrastinate>=3.9.0,<3.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.pyrefly]
project-includes = ["app", "tests"]
python-version = "3.13.0"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "missing-trailing-comma",                     # conflicts with formatter
    "single-line-implicit-string-concatenation",  # conflicts with formatter
    "undocumented-public-module",
    "undocumented-public-package",
    "incorrect-blank-line-before-class",          # conflicts with blank-line-before-class
    "multi-line-summary-second-line",             # conflicts with multi-line-summary-first-line
    "missing-copyright-notice",                   # 社内プロダクトのため不要
    "commented-out-code",                         # 日本語のセクションコメントが誤検知される
    "too-many-arguments",                         # プロンプト構築関数等で自然に多引数になる
    "too-many-positional-arguments",              # 同上
    "no-self-use",                                # framework override メソッドで誤検知される
    "missing-todo-link",                          # Issue リンク強制は不要
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["assert"]  # pytest は assert が前提のため許容
# implicit-namespace-package: Alembic の migration ファイルは, SQLAlchemy のモデル定義に依存するため, 型チェックを無効化する.
# line-too-long: 外部ライブラリ由来の SQL (procrastinate schema.sql 等) を op.execute に raw string で埋め込むため, 行長を自主管理できない.
"app/db/migrations/**" = ["implicit-namespace-package", "line-too-long"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlmodel.SQLModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

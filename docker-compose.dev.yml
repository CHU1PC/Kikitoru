services:
  db:
    image: postgres:18-alpine
    container_name: kikitoru-dev-db
    environment:
      POSTGRES_DB: kikitoru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: kikitoru-dev-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &backend-env
      # glibc malloc arena 数を制限して RSS 単調増加を抑える
      MALLOC_ARENA_MAX: "2"
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-dev_password}@db:5432/kikitoru
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:8000"]}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    ports:
      - "8000:8000"
    command: uv run fastapi dev main.py --host 0.0.0.0 --port 8000
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: sync
          path: ./backend/alembic.ini
          target: /app/alembic.ini
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
        - action: rebuild
          path: ./backend/Dockerfile

  migrate:
    build:
      context: ./backend
    container_name: kikitoru-dev-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
      PYTHONPATH: /app
    command: uv run --no-sync alembic upgrade head
    restart: "no"

  worker:
    build:
      context: ./backend
    container_name: kikitoru-dev-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      PYTHONPATH: /app
    command: uv run --no-sync procrastinate --app=app.queue.app.queue_app worker --queues=stt --concurrency=${WORKER_CONCURRENT_LIMIT:-4} --delete-jobs=successful
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
        - action: rebuild
          path: ./backend/Dockerfile

volumes:
  postgres_dev_data:
